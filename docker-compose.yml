services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: harbourlight
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/harbourlight?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-auth-secret-not-for-production-use-32}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret-not-for-production}
      BCRYPT_COST: ${BCRYPT_COST:-4}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: private
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
